name: Deploy staging

# Event-driven: every push to main deploys to the STAGING worker exactly once.
# Production is never touched here — the worker name and D1 binding come from
# apps/web/wrangler.staging.jsonc, which targets erudoza-staging only.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it in the repo's Settings -> Secrets and variables -> Actions before staging auto-deploy can run."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run build:native
      - run: npx wrangler deploy --config wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify staging health
        run: curl -fsS https://erudoza-staging.fedilms-deployment-companion.workers.dev/api/v1/health
