name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  browser-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web
      - run: npm --workspace apps/web run build:native
      - run: npx playwright test --config playwright.coffee.config.ts
        working-directory: apps/web
        env:
          COFFEE_WIDGET_PREVIEW: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-support-failures
          path: apps/web/test-results/coffee-widget/
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore apps/api/Erudoza.sln
      - run: dotnet format apps/api/Erudoza.sln --verify-no-changes --severity warn
      - run: dotnet build apps/api/Erudoza.sln --no-restore
      - run: dotnet test apps/api/Erudoza.sln --no-build

  e2e:
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file infra/bicep/main.bicep
