name: Visual screenshots

# Captures key pages at 1440/390/320 against the self-contained Miniflare
# fixture (seeded coach + student, no dotnet, no Cloudflare account) and
# uploads them as artifacts — visual evidence for review before production
# deploys. Runs on every push to main and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run build:native
      - run: npx playwright test --config playwright.visual.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-screenshots
          path: apps/web/test-results/visual-screenshots/
          retention-days: 14
